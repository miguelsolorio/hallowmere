name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      multiplayer_server_url:
        description: 'Public backend URL for this run: wss://<backend-host>/multiplayer (optional override)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate game
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install server dependencies
        run: npm ci
      - name: Run tests
        run: npm test

      - name: Validate static game
        run: npm run build

  prepare:
    name: Prepare Pages deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check multiplayer deployment setup
        env:
          MULTIPLAYER_SERVER_URL: ${{ inputs.multiplayer_server_url || vars.MULTIPLAYER_SERVER_URL || secrets.MULTIPLAYER_SERVER_URL }}
        shell: bash
        run: |
          if [[ -z "${MULTIPLAYER_SERVER_URL//[[:space:]]/}" ]]; then
            echo "::error::Pages deployment blocked: set MULTIPLAYER_SERVER_URL to the deployed backend's wss://<host>/multiplayer URL, or supply it in Run workflow."
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Pages deployment blocked: missing multiplayer backend URL

          Tests and static validation passed, but the game cannot be deployed until its multiplayer backend URL is configured. GitHub Pages serves static files and cannot run the game's Node/WebSocket server. The existing public game has been left in place.

          1. Deploy the multiplayer backend using the repository's `render.yaml` and README instructions.
          2. In **Settings → Secrets and variables → Actions → Variables**, set `MULTIPLAYER_SERVER_URL` to `wss://<backend-host>/multiplayer`. The `github-pages` environment variable or a secret with the same name also works.
          3. Run **Deploy game to GitHub Pages** again on `main`. You can also supply the public backend URL in **Run workflow** for a single deployment; save the variable for automatic deployments on future pushes.

          The backend must pass its health and protocol checks before a new frontend can be published.
          EOF
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure live multiplayer
        env:
          MULTIPLAYER_SERVER_URL: ${{ inputs.multiplayer_server_url || vars.MULTIPLAYER_SERVER_URL || secrets.MULTIPLAYER_SERVER_URL }}
        run: npm run configure:multiplayer

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-site:
    name: Deploy to miguelsolorio.com
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: prepare
    uses: miguelsolorio/miguelsolorio.com/.github/workflows/deploy-project.yml@master
    secrets:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
