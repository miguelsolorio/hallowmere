# One shared in-memory world. Scaling beyond one instance would split the party.
services:
  - type: web
    name: hallowmere-multiplayer
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://miguelsolorio.github.io,https://miguelsolorio.com,https://www.miguelsolorio.com
